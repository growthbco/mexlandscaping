name: LSA lead poll

# Speed-to-lead poller. Vercel Hobby crons only run daily, so this Action pings
# the ingest endpoint every ~5 minutes to check the LSA inbox and auto-reply.
# Requires a repo secret CRON_SECRET (Settings > Secrets and variables > Actions)
# matching the CRON_SECRET env var in Vercel.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Ping LSA ingest endpoint
        run: |
          curl -sS -L --max-time 120 \
            "https://www.mexlandscaping.com/api/cron/ingest-lsa/?key=${{ secrets.CRON_SECRET }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
