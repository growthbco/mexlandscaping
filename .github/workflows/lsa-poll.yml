name: LSA lead poll

# Speed-to-lead poller. Vercel Hobby crons are daily-only and GitHub's schedule
# minimum is every 5 min, so each scheduled run loops internally — pinging the
# ingest endpoint every 60s for ~5 minutes — for ~1-minute effective polling.
# The concurrency group prevents overlapping runs (avoids double-processing).
# Requires a repo secret CRON_SECRET matching the Vercel env var.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'audit reads only; recover imports without sending; health reads status; poll runs normal automation'
        type: choice
        default: audit
        options: [audit, recover, health, poll]

permissions:
  contents: read

concurrency:
  group: lsa-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Check or poll the LSA importer
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mode="${REQUESTED_MODE:-poll}"
          count=1
          if [ "$EVENT_NAME" = schedule ]; then mode=poll; count=5; fi
          case "$mode" in audit|recover|health|poll) ;; *) exit 1 ;; esac
          method=GET
          suffix="?mode=$mode"
          if [ "$mode" = recover ]; then method=POST; suffix="$suffix&confirm=recover_without_sending"; fi
          for i in $(seq 1 "$count"); do
            # No redirect or secret in URL. A 503 now fails the workflow visibly.
            curl --fail-with-body --silent --show-error --max-time 250 \
              -X "$method" -H "Authorization: Bearer $CRON_SECRET" \
              "https://mexlandscaping.com/api/cron/ingest-lsa/$suffix"
            if [ "$i" -lt "$count" ]; then sleep 60; fi
          done
