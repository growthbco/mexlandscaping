name: LSA lead poll

# Speed-to-lead poller. Vercel Hobby crons are daily-only and GitHub's schedule
# minimum is every 5 min, so each scheduled run loops internally — pinging the
# ingest endpoint every 60s for ~5 minutes — for ~1-minute effective polling.
# The concurrency group prevents overlapping runs (avoids double-processing).
# Requires a repo secret CRON_SECRET matching the Vercel env var.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: lsa-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll LSA ingest every 60s for ~5 min
        run: |
          for i in $(seq 1 5); do
            curl -sS -L --max-time 90 \
              "https://www.mexlandscaping.com/api/cron/ingest-lsa/?key=${{ secrets.CRON_SECRET }}" \
              -o /dev/null -w "poll $i: HTTP %{http_code}\n"
            if [ "$i" -lt 5 ]; then sleep 60; fi
          done
